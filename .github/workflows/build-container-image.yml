name: 'Build: Container Image'
run-name: 'Build: Container Image (${{ inputs.tag || github.ref_name }})'

on:
  push:
    tags:
      - 'n8n@*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build, for example n8n@2.48.7
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-app:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve image version
        id: version
        run: |
          version="${TAG#n8n@}"
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag ${TAG} does not give a valid image tag."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read the Node version
        id: node
        run: |
          version=$(sed -nE 's/^variable "NODE_VERSION" \{ default = "([^"]+)" \}$/\1/p' docker/docker-bake.hcl)
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ steps.node.outputs.version }}
          build-command: ''

      - name: Apply i18n overlay
        run: |
          if [ -f .github/scripts/i18n/scripts/apply-overlay.mjs ]; then
            node .github/scripts/i18n/scripts/apply-overlay.mjs --repo-root "$GITHUB_WORKSPACE"
          else
            echo "::warning::Tag ${TAG} has no .github/scripts/i18n/scripts/apply-overlay.mjs. The image uses English only."
          fi

      - name: Build
        run: pnpm build:n8n

      - name: Save Docker build context
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: n8n-image-build-context-${{ github.run_id }}
          path: compiled

  build-image:
    name: Build image (${{ matrix.arch }})
    needs: build-app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest_amd64: ${{ steps.build.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.build.outputs.digest_arm64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Restore Docker build context
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: n8n-image-build-context-${{ github.run_id }}
          path: compiled
          fail-on-cache-miss: true

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        env:
          N8N_VERSION: ${{ needs.build-app.outputs.version }}
          N8N_RELEASE_TYPE: stable
          N8N_TAGS: ${{ env.IMAGE_NAME }}
          PLATFORMS: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker buildx bake -f docker/docker-bake.hcl n8n \
            --provenance=false \
            --sbom=false \
            --metadata-file "$RUNNER_TEMP/bake-metadata.json" \
            --set 'n8n.output=type=image,oci-mediatypes=true,push-by-digest=true,name-canonical=true,push=true' \
            --set "n8n.labels.org.opencontainers.image.source=${SOURCE_URL}"

          digest=$(jq -er '.n8n["containerimage.digest"]' "$RUNNER_TEMP/bake-metadata.json")
          echo "digest_${ARCH}=${digest}" >> "$GITHUB_OUTPUT"

  push-manifest:
    name: Push multi-arch manifest
    needs: [build-app, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push manifest
        env:
          VERSION: ${{ needs.build-app.outputs.version }}
          DIGEST_AMD64: ${{ needs.build-image.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.build-image.outputs.digest_arm64 }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${DIGEST_AMD64}" \
            "${IMAGE_NAME}@${DIGEST_ARM64}"

          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
          echo "Pushed ${IMAGE_NAME}:${VERSION} and ${IMAGE_NAME}:latest." >> "$GITHUB_STEP_SUMMARY"
