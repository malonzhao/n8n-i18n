name: 'Util: Sync Upstream Release Tag'
run-name: "Util: Sync Upstream Release Tag (${{ inputs.tag || 'latest release' }})"

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to translate and publish, for example n8n@2.48.7. Leave empty to use the latest upstream release
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sync-upstream-release-tag-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: n8n-io/n8n
  UPSTREAM_URL: https://github.com/n8n-io/n8n.git

jobs:
  sync-master:
    name: Sync master with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write

    steps:
      - name: Merge upstream master
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the SYNC_UPSTREAM_TOKEN secret. The token needs write access to Contents and Workflows to merge the upstream master branch."
            exit 1
          fi

          if ! response=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master); then
            echo "::error::Could not merge the upstream master branch into master. Resolve the merge conflicts or check the token permissions. Response: ${response}"
            exit 1
          fi

          merge_type=$(jq -r .merge_type <<< "$response")
          base_branch=$(jq -r .base_branch <<< "$response")
          if [ "$merge_type" = 'none' ]; then
            echo "master already contains ${base_branch}. Nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            echo "Synced master with ${base_branch} (${merge_type})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable upstream workflows and cancel their runs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ steps.merge.outputs.merged }}
          FORK_WORKFLOWS: .github/workflows/build-container-image.yml .github/workflows/sync-upstream-and-translate.yml
        run: |
          if [ "$MERGED" = 'true' ]; then
            sleep 30
          fi

          upstream=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
            jq -c --arg keep "$FORK_WORKFLOWS" '[.[].workflows[] | select((.path | startswith(".github/workflows/")) and (.path | IN($keep | split(" ")[]) | not))]')

          jq -r '.[] | select(.state == "active") | "\(.id)\t\(.path)"' <<< "$upstream" |
            while IFS=$'\t' read -r id path; do
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
              echo "Disabled ${path}." | tee -a "$GITHUB_STEP_SUMMARY"
            done

          ids=$(jq -c '[.[].id]' <<< "$upstream")
          for run_status in requested pending waiting queued in_progress; do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?status=${run_status}&per_page=100" |
              jq -r --argjson ids "$ids" '.[].workflow_runs[] | select(.workflow_id | IN($ids[])) | "\(.id)\t\(.path)"'
          done | sort -u |
            while IFS=$'\t' read -r run_id path; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" > /dev/null; then
                echo "Cancelled run ${run_id} of ${path}." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Could not cancel run ${run_id} of ${path}."
              fi
            done

  prepare:
    name: Resolve release tag and locales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      pending: ${{ steps.release.outputs.pending }}
      matrix: ${{ steps.locales.outputs.matrix }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          fi
          if [[ ! "$tag" =~ ^n8n@[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::Tag '${tag}' is not a valid n8n release tag."
            exit 1
          fi

          upstream_refs=$(git ls-remote --tags --refs "$UPSTREAM_URL" "refs/tags/${tag}" | cut -f2)
          if ! grep -Fxq "refs/tags/${tag}" <<< "$upstream_refs"; then
            echo "::error::Tag ${tag} does not exist in ${UPSTREAM_REPO}."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_TAG" ]; then
            echo "Tag ${tag} was requested manually. Its translations are updated." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          origin_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          origin_refs=$(git ls-remote --tags --refs "$origin_url" "refs/tags/${tag}" | cut -f2)
          if grep -Fxq "refs/tags/${tag}" <<< "$origin_refs"; then
            echo "Tag ${tag} already exists in ${GITHUB_REPOSITORY}. Nothing to do."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${tag} does not exist in ${GITHUB_REPOSITORY}. It needs a release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout i18n directory
        if: steps.release.outputs.pending == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: .github/scripts/i18n
          persist-credentials: false

      - name: Read locales
        id: locales
        if: steps.release.outputs.pending == 'true'
        run: |
          matrix=$(jq -c '[.locales[].code]' .github/scripts/i18n/config.json)
          if [ "$matrix" = '[]' ]; then
            echo "::error::.github/scripts/i18n/config.json lists no locales."
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  translate:
    name: Translate (${{ matrix.locale }})
    needs: prepare
    if: needs.prepare.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout i18n directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: .github/scripts/i18n
          persist-credentials: false

      - name: Checkout English messages of the upstream tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: .upstream
          fetch-depth: 1
          sparse-checkout: packages/frontend/@n8n/i18n/src/locales
          persist-credentials: false

      - name: Save base files
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          base="${RUNNER_TEMP}/i18n-artifact/base"
          for kind in locales state; do
            file=".github/scripts/i18n/${kind}/${LOCALE}.json"
            if [ -f "$file" ]; then
              mkdir -p "${base}/${kind}"
              cp "$file" "${base}/${kind}/"
            fi
          done

      - name: Translate
        env:
          LOCALE: ${{ matrix.locale }}
          I18N_API_BASE_URL: ${{ secrets.I18N_API_BASE_URL }}
          I18N_API_KEY: ${{ secrets.I18N_API_KEY }}
          I18N_MODEL: ${{ secrets.I18N_MODEL }}
          I18N_CONCURRENCY: ${{ secrets.I18N_CONCURRENCY }}
        run: |
          node .github/scripts/i18n/scripts/translate.mjs \
            --source .upstream/packages/frontend/@n8n/i18n/src/locales/en.json \
            --locale "$LOCALE"

      - name: Stage translation files
        if: ${{ !cancelled() }}
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          stage="${RUNNER_TEMP}/i18n-artifact"
          for kind in locales state; do
            file=".github/scripts/i18n/${kind}/${LOCALE}.json"
            if [ -f "$file" ]; then
              mkdir -p "${stage}/${kind}"
              cp "$file" "${stage}/${kind}/"
            fi
          done

      - name: Upload translation files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: i18n-${{ matrix.locale }}
          path: ${{ runner.temp }}/i18n-artifact
          if-no-files-found: ignore
          retention-days: 7

  commit:
    name: Commit translations
    needs: [prepare, translate]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout i18n directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: .github/scripts/i18n

      - name: Checkout English messages of the upstream tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: .upstream
          fetch-depth: 1
          sparse-checkout: packages/frontend/@n8n/i18n/src/locales
          persist-credentials: false

      - name: Download translation files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: i18n-*
          path: ${{ runner.temp }}/i18n-results
          merge-multiple: true

      - name: Merge, commit, and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          results="${RUNNER_TEMP}/i18n-results"
          source=".upstream/packages/frontend/@n8n/i18n/src/locales/en.json"
          if [ ! -d "$results" ]; then
            echo "No translation results for ${TAG}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin master
            git reset --hard FETCH_HEAD
            node .github/scripts/i18n/scripts/merge-results.mjs --source "$source" --results-dir "$results"

            git add -A -- .github/scripts/i18n
            if git diff --cached --quiet; then
              echo "No translation changes for ${TAG}." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m "chore: Update UI translations for ${TAG}"

            if git push origin HEAD:master; then
              echo "Committed the UI translations for ${TAG}." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push attempt ${attempt} failed. Merging again on the latest master."
            sleep $((attempt * 10))
          done

          echo "::error::Could not push the UI translations for ${TAG}."
          exit 1

  publish-tag:
    name: Publish release tag
    needs: [prepare, commit]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check token and existing tag
        id: check
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SYNC_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Set the SYNC_UPSTREAM_TOKEN secret. The token needs write access to Contents and Workflows to push the release commit, and its tag push triggers the image build."
            exit 1
          fi

          origin_url="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          refs=$(git ls-remote --tags --refs "$origin_url" "refs/tags/${TAG}" | cut -f2)
          if grep -Fxq "refs/tags/${TAG}" <<< "$refs"; then
            echo "Tag ${TAG} already exists in ${GITHUB_REPOSITORY}. It is not moved." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout master
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}

      - name: Create and push release tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          tag_ref="refs/tags/${TAG}"
          remote_has_tag() {
            local refs
            if ! refs=$(git ls-remote --tags --refs origin "$tag_ref"); then
              echo "::error::Could not list the tags of ${GITHUB_REPOSITORY}."
              exit 1
            fi
            cut -f2 <<< "$refs" | grep -Fxq "$tag_ref"
          }

          master_sha=$(git rev-parse HEAD)
          git fetch --no-tags "$UPSTREAM_URL" "$tag_ref"
          upstream_sha=$(git rev-parse "FETCH_HEAD^{commit}")

          git checkout --quiet --detach "$upstream_sha"
          git rm -r --quiet --ignore-unmatch -- .github/scripts/i18n
          git checkout "$master_sha" -- .github/scripts/i18n .github/workflows/build-container-image.yml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "chore: Add UI translations and image build workflow for ${TAG}"
          release_sha=$(git rev-parse HEAD)

          if remote_has_tag; then
            echo "Tag ${TAG} appeared in ${GITHUB_REPOSITORY} during this run. It is not moved." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git tag "$TAG" "$release_sha"
          if ! git push origin "$tag_ref"; then
            if remote_has_tag; then
              echo "Tag ${TAG} appeared in ${GITHUB_REPOSITORY} during the push. It is not moved." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Could not push tag ${TAG}."
            exit 1
          fi

          {
            echo "Pushed tag \`${TAG}\`."
            echo ""
            echo "| | Commit |"
            echo "| --- | --- |"
            echo "| Upstream tag commit | \`${upstream_sha}\` |"
            echo "| Master with translations | \`${master_sha}\` |"
            echo "| Release commit | \`${release_sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
